[tools]
python = "3.12.13"
node = "22.22.3"
just = "1.50.0"
shellcheck = "0.11.0"
shfmt = "3.13.1"
ripgrep = "15.1.0"

[env]
DOTFILES_REPO_ROOT = "{{ config_root }}"
_.path = [
  "{{ config_root }}/scripts",
  "~/.local/bin",
]

[tasks.install]
description = "Install the full current-user development environment"
run = "PYTHONPATH=src .venv/bin/python -m dotfiles_installer.cli"

[tasks.dry-run]
description = "Show setup actions without changing files"
run = "DOTFILES_DRY_RUN=1 PYTHONPATH=src .venv/bin/python -m dotfiles_installer.cli"

[tasks.check]
description = "Run tests and pre-commit hooks"
run = ".venv/bin/python -m pytest && .venv/bin/pre-commit run --all-files"

[tasks.fmt]
description = "Format Python code"
run = ".venv/bin/black --line-length 79 --target-version py39 src tests && .venv/bin/isort --profile black --line-length 79 src tests"
