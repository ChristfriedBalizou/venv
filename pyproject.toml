[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dotfiles-installer"
description = "Current-user development environment installer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "lincl @ https://github.com/ChristfriedBalizou/lincl/archive/67e32543e07aedf54c192547899d07f223e8ceb1.tar.gz",
]
dynamic = ["version"]

[tool.lincl]
timeout = 300

[project.scripts]
dotfiles-install = "dotfiles_installer.cli:main"
src-jump = "dotfiles_installer.src_jump:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "dotfiles_installer.__version__"}

[tool.black]
line-length = 79
target-version = ["py39"]
