---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install lint dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --require-hashes \
            --requirement requirements.txt \
            --requirement requirements-dev.txt
          pip-sync requirements.txt requirements-dev.txt
          python -m pip install --no-deps -e .
          pre-commit install --install-hooks

      - name: Validate repository
        run: |
          .venv/bin/python -m pytest
          .venv/bin/pre-commit run --all-files
          bash -n bootstrap.sh tests/*.sh
          git diff --check

  install:
    # The image reference is the single source of truth for the displayed OS
    # version, so dependency updates cannot leave a stale matrix label behind.
    name: Install (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:12-slim
          - debian:13-slim
          - ubuntu:22.04
          - ubuntu:24.04
          - quay.io/centos/centos:stream9

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run fresh-install test
        env:
          TEST_IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            "$TEST_IMAGE" \
            bash /workspace/tests/install.sh

  required:
    name: CI Required
    if: always()
    needs:
      - lint
      - install
    runs-on: ubuntu-24.04
    steps:
      - name: Require every test job to pass
        env:
          INSTALL_RESULT: ${{ needs.install.result }}
          LINT_RESULT: ${{ needs.lint.result }}
        run: |
          test "$LINT_RESULT" = success
          test "$INSTALL_RESULT" = success
