---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Tag

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Force a bump type, or auto-detect from merged Renovate PRs
        required: true
        default: auto
        type: choice
        options:
          - auto
          - major
          - minor
          - patch
          - none
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  main:
    name: Tag
    runs-on: ubuntu-latest
    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read

      - name: Determine Next Tag
        id: determine-next-tag
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |-
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.sha;
            const forcedBump = "${{ inputs.bump || 'auto' }}";
            const semverTagPattern = /^v?(\d+)\.(\d+)\.(\d+)$/;
            const bumpRank = { none: 0, patch: 1, minor: 2, major: 3 };

            const compareVersions = (left, right) => {
              for (let index = 0; index < 3; index += 1) {
                const diff = left.version[index] - right.version[index];
                if (diff !== 0) return diff;
              }
              return 0;
            };

            const { data: rawTags } = await github.rest.repos.listTags({
              owner,
              repo,
              per_page: 100,
            });

            const tags = rawTags
              .map((tag) => {
                const match = tag.name.match(semverTagPattern);
                if (!match) return null;
                return {
                  name: tag.name,
                  version: match.slice(1).map(Number),
                };
              })
              .filter(Boolean)
              .sort(compareVersions);

            const previousTag = tags.at(-1);
            const previousVersion = previousTag?.version || [0, 0, 0];

            let commits = [];
            if (previousTag) {
              const comparison = await github.rest.repos.compareCommitsWithBasehead({
                owner,
                repo,
                basehead: `${previousTag.name}...${sha}`,
                per_page: 100,
              });
              commits = comparison.data.commits;
            } else {
              const listed = await github.rest.repos.listCommits({
                owner,
                repo,
                sha,
                per_page: 100,
              });
              commits = listed.data;
            }

            const pullRequests = new Map();
            for (const commit of commits) {
              const associated = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: commit.sha,
              });

              for (const pullRequest of associated.data) {
                pullRequests.set(pullRequest.number, pullRequest);
              }
            }

            const renovatePullRequests = [...pullRequests.values()].filter((pullRequest) => {
              const labels = pullRequest.labels.map((label) => label.name);
              const actor = pullRequest.user?.login || "";
              return actor === "renovate[bot]" ||
                actor === "renovate" ||
                labels.some((label) => label.startsWith("renovate/")) ||
                /^renovate\//i.test(pullRequest.head.ref);
            });

            const classifyPullRequest = (pullRequest) => {
              const labels = pullRequest.labels.map((label) => label.name);
              const title = pullRequest.title;

              if (labels.includes("type/major") || /\bmajor\b|breaking/i.test(title)) {
                return "major";
              }

              if (labels.includes("type/minor") || /\bminor\b/i.test(title)) {
                return "minor";
              }

              if (
                labels.includes("type/patch") ||
                labels.includes("type/digest") ||
                labels.includes("type/pin") ||
                labels.includes("type/lockFileMaintenance") ||
                labels.includes("type/lockfile-maintenance")
              ) {
                return "patch";
              }

              return "patch";
            };

            let bump = "none";
            if (["major", "minor", "patch", "none"].includes(forcedBump)) {
              bump = forcedBump;
            } else {
              for (const pullRequest of renovatePullRequests) {
                const candidate = classifyPullRequest(pullRequest);
                if (bumpRank[candidate] > bumpRank[bump]) bump = candidate;
              }
            }

            if (bump === "none") {
              core.notice("No Renovate dependency updates found; no tag will be created.");
              core.setOutput("should_tag", "false");
              return;
            }

            const nextVersion = [...previousVersion];
            if (bump === "major") {
              nextVersion[0] += 1;
              nextVersion[1] = 0;
              nextVersion[2] = 0;
            } else if (bump === "minor") {
              nextVersion[1] += 1;
              nextVersion[2] = 0;
            } else {
              nextVersion[2] += 1;
            }

            const nextTag = `v${nextVersion.join(".")}`;
            const summary = renovatePullRequests
              .map((pullRequest) => `#${pullRequest.number} ${pullRequest.title}`)
              .join("\n");

            core.notice(`Previous tag: ${previousTag?.name || "none"}`);
            core.notice(`Bump: ${bump}`);
            core.notice(`Next tag: ${nextTag}`);

            core.setOutput("should_tag", "true");
            core.setOutput("tag", nextTag);
            core.setOutput("message", [
              nextTag,
              "",
              `Bump: ${bump}`,
              "",
              summary || "Manual tag workflow run.",
            ].join("\n"));

      - name: Create Tag
        if: steps.determine-next-tag.outputs.should_tag == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TAG_NAME: ${{ steps.determine-next-tag.outputs.tag }}
          TAG_MESSAGE: ${{ steps.determine-next-tag.outputs.message }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |-
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tagName = process.env.TAG_NAME;
            const message = process.env.TAG_MESSAGE;

            const existingTag = await github.rest.git.getRef({
              owner,
              repo,
              ref: `tags/${tagName}`,
            }).catch((error) => {
              if (error.status === 404) return null;
              throw error;
            });

            if (existingTag) {
              core.notice(`Tag ${tagName} already exists; skipping.`);
              return;
            }

            const tag = await github.rest.git.createTag({
              owner,
              repo,
              tag: tagName,
              message,
              object: context.sha,
              type: "commit",
            });

            await github.rest.git.createRef({
              owner,
              repo,
              ref: `refs/tags/${tagName}`,
              sha: tag.data.sha,
            });
